# ============================================================
# SIH Inspection Platform — Spring Boot Backend Configuration
# ============================================================
# Uses embedded in-memory H2 database by default (zero setup).
# Automatically switches to PostgreSQL if DB_URL is overridden.
# ============================================================

spring:
  profiles:
    active: local
  application:
    name: inspection-backend

  # --- Database Configuration (H2 in-memory default with PostgreSQL mode) ---
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sih_inspection;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update     # Generates and updates tables directly from @Entity classes
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- H2 Web Console (Available at http://localhost:8080/h2-console) ---
  h2:
    console:
      enabled: true
      path: /h2-console

  # --- Flyway ---
  flyway:
    enabled: false

# --- Application Security & JWT ---
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:86400000}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# --- Logging ---
logging:
  level:
    root: INFO
    com.sih.inspection: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
